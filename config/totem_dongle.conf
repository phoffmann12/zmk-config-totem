# Dongle (central) build only.
# ponytail: the generic BLE/clock lines are duplicated from totem.conf on purpose,
# so this file is correct whether ZMK merges the base+shield confs or replaces one
# with the other. If you confirm ZMK merges them, drop the duplicated block.
CONFIG_ZMK_USB_LOGGING=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Central fetches peripheral battery levels and proxies them to the host,
# so the OS sees the battery of both halves.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Prospector display (only built with the prospector_adapter shield).
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
